<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuestos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Presupuestos</title>
<style>
/* Estética iOS 26: fondo agrupado, listas en tarjetas redondeadas, controles de vidrio flotantes, tipografía del sistema. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.2); --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.16); --thumb:#FFFFFF;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --tint:rgba(0,122,255,.12);
  --glass:rgba(255,255,255,.84); --glass-brd:rgba(255,255,255,.8); --navglass:rgba(242,242,247,.78);
  --shadow:0 10px 36px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.07); --shadow-sm:0 2px 10px rgba(0,0,0,.08),0 0 1px rgba(0,0,0,.1);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --r:26px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1C1C1E; --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.65); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --thumb:#636366;
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --tint:rgba(10,132,255,.2);
  --glass:rgba(44,44,48,.84); --glass-brd:rgba(255,255,255,.14); --navglass:rgba(0,0,0,.72);
  --shadow:0 10px 36px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); --shadow-sm:0 2px 10px rgba(0,0,0,.4);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--f);font-size:17px;line-height:1.29;letter-spacing:-.41px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus{outline:none}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}

/* Barra superior */
.nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background-color .2s,box-shadow .2s}
.nav.scrolled{background:var(--navglass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nav-in{height:56px;display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding-inline:16px}
.nav-title{flex:1;min-width:0;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.scrolled .nav-title{opacity:1}
.gbtn{height:44px;min-width:44px;border-radius:22px;border:.5px solid var(--glass-brd);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:var(--shadow-sm);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding-inline:16px;font-size:17px;font-weight:500;flex:none}
.gbtn.ic{padding:0;width:44px}
.gbtn svg{width:22px;height:22px}
.gbtn.pro{background:var(--blue);border-color:transparent;color:#fff}
.gbtn:active{transform:scale(.96)}
.large{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:2px 4px}
.large h1{font-family:var(--fd);font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0;overflow-wrap:anywhere}
.large p{margin:2px 0 0;color:var(--label2);font-size:15px;letter-spacing:-.24px}

/* Contenido */
.main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:6px calc(190px + env(safe-area-inset-bottom,0px))}
.main.nobar{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.sec{margin-top:26px}
.sec:first-child{margin-top:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13px;letter-spacing:-.08px;color:var(--label2);text-transform:uppercase;padding-inline:16px;padding-block:0 7px}
.sec-f{font-size:13px;letter-spacing:-.08px;color:var(--label2);padding-inline:16px;padding-block:7px 0;line-height:1.35}
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;position:relative;min-width:0}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;transform:scaleY(.5);transform-origin:top;background:var(--sep)}
.cell.col{flex-direction:column;align-items:stretch;gap:10px}
.cell.sub{padding-left:34px}
.cell .grow{flex:1;min-width:0}
.cell .t{flex:1;min-width:0}
.cell .t .s{display:block;font-size:15px;letter-spacing:-.24px;color:var(--label2);margin-top:1px}
.cell .v{color:var(--label2);text-align:right;flex:none}
.cell .v.strong{color:var(--label);font-weight:600}
.cell.tap{width:100%;border:0;background:transparent;text-align:left}
.cell.tap:active{background:var(--fill)}
.cell.link{color:var(--blue);justify-content:center;font-weight:500}
.cell.link.red{color:var(--red)}
.chev{width:9px;height:15px;color:var(--label3);flex:none}

/* Campos */
.tf{border:0;background:transparent;padding:4px 0;min-width:0;width:100%;text-align:right}
.tf.left{text-align:left}
.tf::placeholder,.box::placeholder,textarea::placeholder{color:var(--label3)}
.box{border:0;background:var(--fill);border-radius:12px;padding:9px 8px;text-align:center;font-size:17px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.box:focus,.tf:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.tf:focus{box-shadow:none}
.box.r{text-align:right;padding-inline:12px;width:128px;flex:none}
.box.pc{width:64px;flex:none}
textarea.area{border:0;background:transparent;width:100%;min-height:110px;resize:vertical;padding:0;line-height:1.4}
.pick{position:relative;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:100px;padding-inline:14px 12px;height:36px;min-width:0;flex:1}
.pick select{appearance:none;-webkit-appearance:none;border:0;background:transparent;position:absolute;inset:0;opacity:0;width:100%}
.pick span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:500}
.pick svg{width:12px;height:16px;color:var(--label2);flex:none}

/* Controles */
.seg{display:flex;background:var(--fill);border-radius:100px;padding:2px;flex:none}
.seg button{flex:1;border:0;background:transparent;border-radius:100px;padding:6px 12px;font-size:15px;font-weight:500;min-width:40px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.seg.full{width:100%}
.sw{position:relative;width:51px;height:31px;border-radius:16px;border:0;background:var(--fill2);flex:none;transition:background-color .2s;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.stp{display:flex;align-items:center;background:var(--fill);border-radius:100px;height:34px;flex:none}
.stp button{border:0;background:transparent;width:44px;height:34px;font-size:22px;font-weight:400;line-height:1;color:var(--label)}
.stp b{min-width:22px;text-align:center;font-size:17px}
.stp.on b{color:var(--blue)}
.xbtn{border:0;background:transparent;width:32px;height:32px;display:grid;place-items:center;color:var(--label3);flex:none;padding:0;border-radius:16px}
.xbtn svg{width:22px;height:22px}
.xbtn.red{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-inline:4px;padding-block:12px 0}
.chip{border:.5px solid var(--glass-brd);background:var(--card);box-shadow:var(--shadow-sm);border-radius:100px;padding:8px 14px;font-size:15px;font-weight:500;color:var(--blue);letter-spacing:-.24px}
.chip:active{transform:scale(.96)}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:100px;border:0;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.pbtn.sec2{background:var(--fill);color:var(--blue)}
.pbtn:active{opacity:.85}
.pbtn svg{width:20px;height:20px}
.stack{display:flex;flex-direction:column;gap:10px}
.check{color:var(--blue);width:20px;height:20px;flex:none}

/* Medidas */
.amb-h{display:flex;align-items:center;gap:8px;padding-inline:4px 0;padding-block:0 8px;margin-top:30px}
.amb-h input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--fd);font-size:24px;font-weight:700;letter-spacing:.07px;padding:2px 0}
.amb-h .m{font-size:15px;color:var(--label2);white-space:nowrap}
.amb-h .conf{border:0;background:var(--red);color:#fff;border-radius:100px;padding:6px 12px;font-size:14px;font-weight:600}
.sup+.sup{margin-top:12px}
.sup-name{font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opts .lbl{font-size:15px;color:var(--label2)}
.medh,.med{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 14px 46px 72px 30px;gap:4px;align-items:center}
.medh.ml,.med.ml{grid-template-columns:minmax(0,1fr) 14px 46px 72px 30px}
.medh{font-size:12px;color:var(--label2);letter-spacing:0}
.medh span:nth-child(5),.medh span:nth-child(3).c{text-align:center}
.med .x{text-align:center;color:var(--label3);font-size:15px}
.med .res{text-align:right;font-weight:600;font-size:16px;letter-spacing:-.3px;white-space:nowrap}
.med.rest .box{background:rgba(255,59,48,.12);color:var(--red)}
.med.rest .res{color:var(--red)}
.meds{display:flex;flex-direction:column;gap:6px}
.acts{display:flex;gap:18px;flex-wrap:wrap}
.acts button{border:0;background:transparent;padding:4px 0;font-size:16px;font-weight:500;color:var(--blue)}
.acts button.red{color:var(--red)}
.price{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price label{font-size:15px;color:var(--label2)}
.price .box{width:96px;padding-block:7px}
.price .box.pc{width:56px}
.subt{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.subt b{display:block;font-size:17px}
.subt span{font-size:14px;color:var(--label2)}

/* Filas de gastos */
.gl{display:grid;grid-template-columns:minmax(0,1fr) 12px 70px;gap:6px;align-items:center}
.gl .x{text-align:center;color:var(--label3)}

/* Resumen */
.hero{padding:18px 16px 16px;display:flex;flex-direction:column;gap:4px}
.hero .k{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px}
.hero .big{font-family:var(--fd);font-size:40px;font-weight:700;letter-spacing:.2px;line-height:1.1}
.hero .row{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:15px;color:var(--label2)}
.hero .row b{color:var(--label);font-weight:600}
.kv .v{color:var(--label);font-variant-numeric:tabular-nums}
.kv.tot .t,.kv.tot .v{font-weight:700}
.kv.good .v{color:var(--green);font-weight:700}
.kv.minus .v{color:var(--label2)}
.amb-row .t b{font-weight:600}

/* Vista del presupuesto */
.preview{padding:12px}
.preview img{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px var(--sep)}

/* Lista */
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .v b{display:block;color:var(--label);font-weight:600}
.item .v span{font-size:15px}
.empty{text-align:center;padding:48px 24px;color:var(--label2);font-size:15px}
.empty b{display:block;color:var(--label);font-size:20px;margin-bottom:6px;font-weight:600}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.banner svg{width:28px;height:28px;color:var(--blue);flex:none;margin-top:2px}
.banner.warn svg{color:var(--orange)}
.banner .t{font-size:15px;letter-spacing:-.24px;color:var(--label2)}
.banner .t b{display:block;color:var(--label);font-size:17px;letter-spacing:-.41px;margin-bottom:2px}
.banner .acts{margin-top:8px}

/* Barra de pestañas flotante */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(calc(env(safe-area-inset-bottom,0px) - 10px),12px);z-index:30;display:flex;gap:0;padding:4px;border-radius:100px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:.5px solid var(--glass-brd);box-shadow:var(--shadow);width:min(calc(100% - 28px),460px)}
.tabbar button{flex:1;min-width:0;border:0;background:transparent;border-radius:100px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--label)}
.tabbar button svg{width:26px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--blue);background:var(--fill)}
.acc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(calc(env(safe-area-inset-bottom,0px) - 10px),12px) + 70px);z-index:29;width:min(calc(100% - 28px),460px);height:50px;border-radius:100px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:.5px solid var(--glass-brd);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:20px;font-variant-numeric:tabular-nums}
.acc span{font-size:15px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc span b{color:var(--label);font-size:17px}
.acc>b{font-size:17px;font-weight:700;white-space:nowrap}
body.typing .tabbar,body.typing .acc{display:none}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:60;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:.5px solid var(--glass-brd);box-shadow:var(--shadow);padding:12px 20px;border-radius:100px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:374px){.medh,.med{grid-template-columns:minmax(0,1fr) 10px minmax(0,1fr) 10px 40px 64px 28px}.large h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importar" class="hidden-file" accept=".json,application/json,text/plain" aria-label="Importar copia">
<script>
(function(){
"use strict";
const VERSION='1.0';
const $app=document.getElementById('app');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const clone=x=>JSON.parse(JSON.stringify(x));
function num(v){
  if(v==null)return 0; if(typeof v==='number')return isFinite(v)?v:0;
  const s=String(v).replace(/\s/g,'').replace(/,/g,'.'); if(!s)return 0;
  let t=0; const parts=s.match(/[+-]?[^+-]+/g)||[];
  for(const p of parts){const x=parseFloat(p); if(isFinite(x))t+=x;}
  return t;
}
function plata(v){if(v==null)return 0; if(typeof v==='number')return v; const x=parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.')); return isFinite(x)?x:0;}
const f2=n=>(Math.round(n*100)/100).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
const $=n=>'$'+Math.round(n).toLocaleString('es-AR');
const fecha=t=>new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'});
const fechaC=t=>new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
const nro=n=>'N° '+String(n||1).padStart(4,'0');

/* Íconos (trazo estilo SF) */
const I={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  ruler:'<svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 16.5 16.5 3.5l6 6-13 13z"/><path d="m8 12 2 2M11 9l2 2M14 6l2 2"/></svg>',
  money:'<svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="13" cy="12" r="9"/><path d="M16 8.6c-.6-.9-1.7-1.4-3-1.4-1.8 0-3 .9-3 2.3 0 3.2 6.2 1.6 6.2 4.9 0 1.4-1.3 2.4-3.2 2.4-1.4 0-2.6-.6-3.2-1.6M13 5.5v1.7M13 16.8v1.7"/></svg>',
  roller:'<svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="3" width="15" height="6" rx="2"/><path d="M18 6h3.5v5.5H12v3"/><rect x="10.5" y="14.5" width="3" height="7" rx="1.2"/></svg>',
  list:'<svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2.5" width="18" height="19" rx="3.5"/><path d="M8.5 8h9M8.5 12h9M8.5 16h5"/></svg>',
  doc:'<svg viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5v9M9 7.5l4 4 4-4"/><path d="M6 11v7.5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V11"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',

function latas(L){
  if(L<=0)return '';

  for(let a=0;a<=Math.ceil(L/20)+1;a++)for(let b=0;b<=2;b++)for(let c=0;c<=3;c++)for(let d=0;d<=3;d++){

}

function compartirImagen(img){

  if(b.reparacion.nivel>0)l.push('Reparaciones previas a la pintura');
  if(b.muebles.on)l.push('Mover y cubrir muebles');
  if(b.altura.on)l.push('Trabajo en altura (andamios y escaleras)');
  return l;
}
function matList(b,c){
  const l=[];
  c.pp.filter(x=>x.unidad==='m2'&&x.p&&x.litros>0).forEach(x=>l.push(x.p.nombre+': '+latas(x.litros)));
  c.pp.filter(x=>x.unidad==='ml'&&x.p).forEach(x=>{if(!l.some(s=>s.startsWith(x.p.nombre+':')))l.push(x.p.nombre+': 1 L');});
  Object.entries(b.materiales).filter(([k,v])=>v>0&&cfg.materiales.includes(k)).forEach(([k,v])=>l.push(v+' × '+k));
  return l;
}
function textoWpp(b){
  const c=calc(b); const L=[];
  L.push('*PRESUPUESTO DE PINTURA* · '+nro(b.numero)); if(b.cliente)L.push(b.cliente); if(b.direccion)L.push(b.direccion); L.push(fecha(Date.now())); L.push('');
  L.push('*Ambientes a pintar*');
  c.porAmb.forEach(A=>{const rs=A.rows.filter(r=>r.q); if(!rs.length)return;
    L.push('• '+(A.a.nombre||'Ambiente')+': '+[A.m2?f2(A.m2)+' m²':'',A.ml?f2(A.ml)+' ml':''].filter(Boolean).join(' + ')+(b.img.precios?' — '+$(A.sub):''));
    rs.forEach(r=>L.push('   - '+r.s.nombre+(r.p?' ('+r.p.nombre+', '+r.s.manos+' manos)':'')+': '+f2(r.q)+(r.s.unidad==='ml'?' ml':' m²')));});
  if(c.extras.length){L.push(''); L.push('*Trabajos adicionales*'); c.extras.forEach(e=>L.push('• '+e[0]+(b.img.precios&&e[1]?' — '+$(e[1]):'')));}
  L.push(''); L.push('*Superficie total:* '+f2(c.m2)+' m²'+(c.ml?' + '+f2(c.ml)+' ml':''));
  if(b.dias)L.push('*Días de trabajo:* '+b.dias);
  L.push(''); L.push('*Incluye*'); incluye(b).forEach(x=>L.push('• '+x));
  if(b.img.materiales){const ms=matList(b,c); if(ms.length){L.push(''); L.push('*Materiales a comprar*'); ms.forEach(x=>L.push('• '+x));}}
  if(b.img.aclaraciones&&b.aclaraciones){L.push(''); L.push('*Aclaraciones*'); b.aclaraciones.split('\n').filter(s=>s.trim()).forEach(x=>L.push('• '+x.trim()));}
  L.push(''); L.push('*Total mano de obra: '+$(c.total)+'*');
  if(cfg.nombre||cfg.telefono){L.push(''); L.push([cfg.nombre,cfg.telefono].filter(Boolean).join(' · '));}
  return L.join('\n');
}

/* --- Imagen tipo factura --- */
async function dibujar(b){
  const c=calc(b), W=1080, P=84, dark=b.img.oscuro, conPrecio=!!b.img.precios;
  const K=dark?{bg:'#000000',ink:'#F5F5F7',mut:'#98989D',line:'#38383A',hair:'#2C2C2E',soft:'#1C1C1E',acc:'#2997FF'}:{bg:'#FFFFFF',ink:'#1D1D1F',mut:'#6E6E73',line:'#D2D2D7',hair:'#E8E8ED',soft:'#F5F5F7',acc:'#0071E3'};
  const FT='-apple-system,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif', FD='-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif';
  const xP=W-P, xQ=conPrecio?W-P-230:W-P, xM=xQ-230;
  function wrap(ctx,t,maxW){const words=String(t).split(/\s+/); const out=[]; let l=''; for(const w of words){const x=l?l+' '+w:w; if(ctx.measureText(x).width>maxW&&l){out.push(l);l=w;}else l=x;} if(l)out.push(l); return out.length?out:[''];}
  function lay(ctx,draw){
    let y=P+36;
    const set=(f,col)=>{ctx.font=f; ctx.fillStyle=col;};
    const T=(t,x,yy,al)=>{if(draw){ctx.textAlign=al||'left'; ctx.fillText(t,x,yy);}};
    const rule=(yy,col,hgt)=>{if(draw){ctx.fillStyle=col||K.line; ctx.fillRect(P,yy,W-2*P,hgt||2);}};
    const cap=(t,x,yy,al)=>{set('600 22px '+FT,K.mut); if(draw&&'letterSpacing' in ctx)ctx.letterSpacing='2.5px'; T(t.toUpperCase(),x,yy,al); if(draw&&'letterSpacing' in ctx)ctx.letterSpacing='0px';};
    // Encabezado
    set('700 42px '+FD,K.ink); T(cfg.nombre||'Presupuesto de pintura',P,y);
    if(cfg.nombre)cap('Presupuesto',W-P,y-8,'right');
    y+=46;
    set('400 28px '+FT,K.mut); if(cfg.telefono)T(cfg.telefono,P,y); else if(cfg.nombre)T('Trabajos de pintura',P,y);
    T(nro(b.numero)+' · '+fecha(Date.now()),W-P,y,'right');
    y+=42; rule(y); y+=76;
    cap('Cliente',P,y); y+=50;
    set('600 40px '+FD,K.ink); T(b.cliente||'—',P,y); y+=46;
    if(b.direccion){set('400 28px '+FT,K.mut); T(b.direccion,P,y); y+=40;}
    y+=56;
    // Tabla de ambientes
    cap('Ambientes a pintar',P,y); cap('Manos',xM,y,'center'); cap('Cantidad',xQ,y,'right'); if(conPrecio)cap('Importe',xP,y,'right');
    y+=24; rule(y); y+=62;
    const ambs=c.porAmb.filter(A=>A.m2||A.ml);
    if(!ambs.length){set('400 30px '+FT,K.mut); T('Sin medidas cargadas',P,y); y+=60;}
    ambs.forEach((A,i)=>{
      set('600 34px '+FT,K.ink); const qa=[A.m2?f2(A.m2)+' m²':'',A.ml?f2(A.ml)+' ml':''].filter(Boolean).join(' + ');
      const nameMax=(conPrecio?xQ-260:xM-60)-P; const nl=wrap(ctx,A.a.nombre||'Ambiente',nameMax); nl.forEach((l,j)=>T(l,P,y+j*42));
      T(qa,xQ,y,'right'); if(conPrecio)T($(A.sub),xP,y,'right');
      y+=(nl.length-1)*42+50;
      A.rows.filter(r=>r.q).forEach(r=>{
        set('400 29px '+FT,K.ink);
        const det=(r.s.nombre||'Superficie')+(r.p?' · '+r.p.nombre:'');
        const ls=wrap(ctx,det,xM-60-(P+30)); ls.forEach((l,j)=>T(l,P+30,y+j*38));
        set('400 29px '+FT,K.mut); T(String(r.s.manos),xM,y,'center');
        set('400 29px '+FT,K.ink); T(f2(r.q)+(r.s.unidad==='ml'?' ml':' m²'),xQ,y,'right');
        if(conPrecio){set('400 29px '+FT,K.mut); T($(r.sub),xP,y,'right');}
        y+=ls.length*38+10;
      });
      y+=18; if(i<ambs.length-1){rule(y,K.hair,2); y+=58;} else y+=10;
    });
    const rowsList=(title,items)=>{if(!items.length)return; y+=36; cap(title,P,y); y+=24; rule(y); y+=58;
      items.forEach(([t,v])=>{set('400 30px '+FT,K.ink); const ls=wrap(ctx,t,(conPrecio?xP-240:W-P)-P); ls.forEach((l,j)=>T(l,P,y+j*40)); if(conPrecio&&v){set('400 30px '+FT,K.ink); T($(v),xP,y,'right');} y+=ls.length*40+14;});
      y+=6;};
    rowsList('Trabajos adicionales',c.extras);
    if(conPrecio)rowsList('Otros conceptos',[...c.rec,...c.gastos]);
    // Datos principales
    y+=40;
    const stats=[['Superficie total',f2(c.m2)+' m²']]; if(c.ml)stats.push(['Zócalos',f2(c.ml)+' ml']); stats.push(['Días de trabajo',b.dias?String(b.dias):'—']);
    const bh=156, cw=(W-2*P)/stats.length;
    if(draw){ctx.fillStyle=K.soft; roundRect(ctx,P,y,W-2*P,bh,28); ctx.fillStyle=K.line; for(let i=1;i<stats.length;i++)ctx.fillRect(P+cw*i,y+32,2,bh-64);}
    stats.forEach(([k,v],i)=>{const x=P+cw*i+32; cap(k,x,y+56); set('600 44px '+FD,K.ink); const fit=wrap(ctx,v,cw-50)[0]; T(fit,x,y+118);});
    y+=bh+44;
    const bullets=(title,items)=>{if(!items.length)return; y+=36; cap(title,P,y); y+=24; rule(y); y+=56;
      set('400 29px '+FT,K.ink); items.forEach(it=>{const ls=wrap(ctx,it,W-2*P-40); if(draw){ctx.fillStyle=K.acc; ctx.beginPath(); ctx.arc(P+8,y-10,5,0,Math.PI*2); ctx.fill(); ctx.fillStyle=K.ink;} ls.forEach((l,j)=>T(l,P+34,y+j*39)); y+=ls.length*39+12;}); y+=4;};
    bullets('Incluye',incluye(b));
    if(b.img.materiales)bullets('Materiales a cargo del cliente',matList(b,c));
    if(b.img.aclaraciones&&b.aclaraciones)bullets('Aclaraciones',b.aclaraciones.split('\n').map(s=>s.trim()).filter(Boolean));
    // Total al final
    y+=40; rule(y,K.ink,3); y+=74;
    set('600 34px '+FT,K.ink); T('Total mano de obra',P,y);
    set('600 44px '+FD,K.ink); T($(c.total),W-P,y+2,'right');
    y+=46; set('400 25px '+FT,K.mut); T(conPrecio?'Incluye todos los conceptos detallados.':'Por '+f2(c.m2)+' m²'+(c.ml?' + '+f2(c.ml)+' ml':'')+(b.dias?' · '+b.dias+(/d[ií]a/i.test(b.dias)?'':' días'):''),P,y);
    return y+P;
  }
  const mc=document.createElement('canvas').getContext('2d');
  const H=Math.ceil(lay(mc,false));
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  ctx.fillStyle=K.bg; ctx.fillRect(0,0,W,H); ctx.textBaseline='alphabetic';
  lay(ctx,true);
  return cv;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill();}

/* --- Copia de seguridad --- */
function descargar(file,marcar){const u=URL.createObjectURL(file); const a=h('a',{href:u,download:file.name}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),8000); if(marcar){meta.lastBackup=Date.now(); saveNow(); render(); toast('Copia descargada');}}
function exportar(){
  saveNow();
  const data=JSON.stringify({app:'presupuestos-pintura',version:1,fecha:Date.now(),cfg,list,meta});
  const name='presupuestos-copia-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([data],name,{type:'application/json'});
  const hecho=()=>{meta.lastBackup=Date.now(); saveNow(); render(); toast('Copia guardada');};
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(hecho).catch(e=>{if(e&&e.name==='AbortError')return; descargar(file,true);});
  }else descargar(file,true);
}
const fileIn=document.getElementById('importar');
fileIn.addEventListener('change',()=>{
  const f=fileIn.files&&fileIn.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result); if(!x||!Array.isArray(x.list))throw 0;
      const map=new Map(list.map(b=>[b.id,b])); let n=0;
      x.list.forEach(rb=>{if(!rb||!rb.id)return; const l=map.get(rb.id); if(!l||(rb.actualizado||0)>(l.actualizado||0)){map.set(rb.id,norm(rb)); n++;}});
      list=[...map.values()];
      if(x.cfg&&!list.length)cfg=Object.assign(clone(DEF_CFG),x.cfg);
      else if(x.cfg&&S.importCfg)cfg=Object.assign(clone(DEF_CFG),x.cfg);
      if(x.meta&&x.meta.nextNum>meta.nextNum)meta.nextNum=x.meta.nextNum;
      saveNow(); render(); toast(n?'Se recuperaron '+n+(n===1?' presupuesto':' presupuestos'):'La copia no tenía nada nuevo');
    }catch(e){toast('Ese archivo no es una copia de esta app');}
    fileIn.value='';};
  r.readAsText(f);
});

/* --- Ajustes --- */
function vAjustes(){
  $app.append(nav('Ajustes',h('button',{class:'gbtn ic','aria-label':'Volver',onclick:()=>{saveNow();go('lista');},html:I.back})));
  $app.append(large('Ajustes'));
  const m=h('div',{class:'main nobar'}); $app.append(m);
  const F=(lab,key,o)=>cell(h('label',{class:'t',for:'cfg-'+key},lab),inp(cfg,key,Object.assign({cfg:true,id:'cfg',cls:'box r'},o||{})));
  m.append(sec('Tus datos',[F('Nombre','nombre',{mode:'text',ph:'Tu nombre',cls:'tf'}),F('Teléfono','telefono',{mode:'tel',ph:'Opcional',cls:'tf'})],'Aparecen arriba del presupuesto que le mandás al cliente.'));
  const rep=cell(h('span',{class:'t'},'% reparaciones',h('span',{class:'s'},'Leve · media · mucha')),...[1,2,3].map(i=>{const e=h('input',{class:'box pc',inputmode:'numeric',id:'cfg-rep'+i,value:String(cfg.recRep[i]??''),'aria-label':'Reparaciones '+NIVELES[i]}); e.addEventListener('input',()=>{cfg.recRep[i]=num(e.value);touchCfg(false);}); return e;}));
  m.append(sec('Precios',[F('m² con 2 manos','precioM2',{mode:'numeric'}),F('Metro lineal zócalo','precioMl',{mode:'numeric'}),F('% cielorraso','recCielo',{mode:'numeric'}),F('% mover muebles','recMuebles',{mode:'numeric'}),F('% trabajo en altura','recAltura',{mode:'numeric'}),rep],'Con 1, 3 o 4 manos el precio se ajusta solo en proporción. En cada superficie podés poner otro precio a mano.'));
  m.append(sec('Valores por día',[F('Garage','garage',{mode:'numeric'}),F('Comida','comida',{mode:'numeric'}),F('Ayudante','ayudante',{mode:'numeric'}),F('Día extra','diaExtra',{mode:'numeric'})],'Se cargan solos en cada presupuesto nuevo.'));
  const pc=cfg.productos.map((p,i)=>cell(inp(p,'nombre',{mode:'text',cfg:true,id:'p'+i,cls:'tf left',label:'Nombre de la pintura',ph:'Nombre'}),inp(p,'rend',{cfg:true,id:'p'+i,cls:'box pc',label:'Rendimiento m² por litro'}),h('span',{class:'v'},'m²/L'),h('button',{class:'xbtn red','aria-label':'Quitar pintura',html:I.minus,onclick:()=>{if(cfg.productos.length<2)return; cfg.productos.splice(i,1);touchCfg(true);}})));
  pc.push(h('button',{class:'cell tap link',onclick:()=>{cfg.productos.push({id:uid(),nombre:'',rend:12}); focusId='p'+(cfg.productos.length-1)+'-nombre'; touchCfg(true);}},'Agregar pintura'));
  m.append(sec('Pinturas y rendimiento',pc,'Rendimiento: m² que cubre 1 litro en una mano.'));
  const lista=(title,arr,key)=>{const ni=h('input',{class:'tf left',placeholder:'Agregar',id:'add-'+key,'aria-label':'Agregar a '+title,autocapitalize:'sentences'});
    return sec(title,[...arr.map((n,i)=>cell(h('span',{class:'t'},n),h('button',{class:'xbtn red','aria-label':'Quitar '+n,html:I.minus,onclick:()=>{arr.splice(i,1);touchCfg(true);}}))),
      cell(ni,h('button',{class:'xbtn',style:'color:var(--blue);width:auto;padding:0 4px;font-weight:600;font-size:17px',onclick:()=>{const v=ni.value.trim(); if(v&&!arr.includes(v)){arr.push(v);focusId='add-'+key;touchCfg(true);}}},'Agregar'))]);};
  m.append(lista('Materiales',cfg.materiales,'mat'));
  m.append(lista('Lo que llevo yo',cfg.herramientas,'her'));
  const ta=h('textarea',{class:'area',id:'cfg-acl','aria-label':'Aclaraciones por defecto'}); ta.value=cfg.aclaraciones; ta.addEventListener('input',()=>{cfg.aclaraciones=ta.value;touchCfg(false);});
  m.append(sec('Aclaraciones por defecto',[h('div',{class:'cell'},ta)],'Se usan en cada presupuesto nuevo. Una por línea.'));
  m.append(sec('Copia de seguridad',[
    h('button',{class:'cell tap link',onclick:exportar},'Exportar copia'),
    h('button',{class:'cell tap link',onclick:()=>fileIn.click()},'Recuperar desde una copia')],
    (meta.lastBackup?'Última copia: '+fecha(meta.lastBackup)+'. ':'Todavía no hiciste ninguna copia. ')+'Guardala en Archivos, iCloud o mandátela por WhatsApp. Si cambiás de teléfono, la recuperás desde acá.'));
  m.append(h('div',{class:'sec-f',style:'text-align:center;padding-top:24px'},'Presupuestos '+VERSION+' · funciona sin internet'));
}

load();
S.keepScroll=false; render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){

  }).catch(()=>{});
}
window.__calc=calc; window.__norm=norm; window.__dibujar=dibujar;
})();
